{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}My Django App{% endblock %}</title>

    {% bootstrap_css %}
</head>
<body>
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    {% bootstrap_javascript %}
</body>
</html>
